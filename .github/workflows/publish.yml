on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:


permissions:
  contents: write

jobs:
  create-packages:
    strategy:
      fail-fast: false
      matrix:
        # this fork only ships android (built on ubuntu) and windows
        os: [ "ubuntu-latest", "windows-2022" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JBR
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ matrix.os }}-gradle
          enableCrossOsArchive: true

      - name: Skip Android build (build android only on Ubuntu)
        if: matrix.os != 'ubuntu-latest'
        shell: "bash"
        run: |
          echo "SKIP_ANDROID_BUILD=true" >> $GITHUB_ENV

      - name: Use Android Secrets
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "ABDM_KEYSTORE_FILE=${{ secrets.ABDM_KEYSTORE_FILE }}" >> $GITHUB_ENV
          echo "ABDM_KEYSTORE_FILE_PASSWORD=${{ secrets.ABDM_KEYSTORE_FILE_PASSWORD }}" >> $GITHUB_ENV
          echo "ABDM_KEYSTORE_KEY_ALIAS=${{ secrets.ABDM_KEYSTORE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ABDM_KEYSTORE_KEY_PASSWORD=${{ secrets.ABDM_KEYSTORE_KEY_PASSWORD }}" >> $GITHUB_ENV

      # without the keystore secrets the apk is signed by a new key in each build
      # so it can't be installed over the previous one
      - name: Use a temporary keystore when there is no keystore secret
        if: matrix.os == 'ubuntu-latest' && env.ABDM_KEYSTORE_FILE == ''
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI"
          echo "ABDM_KEYSTORE_FILE=file:$RUNNER_TEMP/ci.jks" >> $GITHUB_ENV
          echo "ABDM_KEYSTORE_FILE_PASSWORD=android" >> $GITHUB_ENV
          echo "ABDM_KEYSTORE_KEY_ALIAS=ci" >> $GITHUB_ENV
          echo "ABDM_KEYSTORE_KEY_PASSWORD=android" >> $GITHUB_ENV

      - name: Gradle
        run: |
          ./gradlew
        shell: "bash"

      - name: Build windows package
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          ./gradlew createReleaseFolderForCi

      - name: Build android package
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ./gradlew android:app:createBinariesForCi createChangeNoteForCi

      - name: Release Gradle to unlock cache files
        shell: bash
        run: |
          ./gradlew -stop

      - name: Upload output to artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ./build/ci-release
          name: app-${{ matrix.os }}

      - name: Unit tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ./gradlew android:app:testDebugUnitTest

  release:
    # manual runs only produce the artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: "ubuntu-latest"
    needs: [ "create-packages" ]
    steps:
      - uses: "actions/download-artifact@v4"
        name: "Download All Artifacts Into One Directory"
        with:
          path: release
          pattern: app-*
          merge-multiple: true

      - name: Version Info
        id: version
        uses: nowsprinting/check-version-format-action@v3
        with:
          prefix: "v"

      - name: "Show the output tree of release"
        run: |
          tree .
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ !steps.version.outputs.is_stable }}
          make_latest: legacy
          draft: true
          files: |
            release/binaries/*
          body_path: release/release-notes.md
      - name: "Remove artifacts to free space"
        uses: geekyeggo/delete-artifact@v5
        with:
          name: app-*
